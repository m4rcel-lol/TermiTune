[package]
name = "termitune"
version = "0.1.0"
edition = "2021"
authors = ["m4rcel-lol"]
description = "A beautiful TUI MP3 music player for Arch Linux"
license = "MIT"
repository = "https://github.com/m4rcel-lol/TermiTune"

[[bin]]
name = "termitune"
path = "src/main.rs"

[dependencies]
ratatui       = "0.26"
crossterm     = { version = "0.27", features = ["event-stream"] }
rodio         = { version = "0.17", features = ["mp3"] }
rustfft       = "6.1"
lofty         = "0.18"
walkdir       = "2"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
dirs          = "5"
anyhow        = "1"
parking_lot   = "0.12"
num-complex   = "0.4"
unicode-width = "0.1"
chrono        = { version = "0.4", features = ["serde"] }
log           = "0.4"
simplelog     = "0.12"
notify-rust   = { version = "4", optional = true }
rand          = "0.8"

[features]
default = []
notifications = ["notify-rust"]

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
